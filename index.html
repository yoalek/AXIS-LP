<!DOCTYPE html>
<html lang="pt-br" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" as="image" href="/joseane.webp">
  <title>RH-DP Outsourcing | Gestão Estratégica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Trust & Authority Palette - Professional Navy & Slate */
      --background: #F8FAFC;
      --foreground: #020617;

      --card: #ffffff;
      --card-foreground: #020617;

      --popover: #ffffff;
      --popover-foreground: #020617;

      --primary: #0369A1;
      /* Professional Blue (Sky 700) - Contrast 4.5:1+ on White */
      --primary-foreground: #ffffff;

      --secondary: #334155;
      /* Slate */
      --secondary-foreground: #ffffff;

      --muted: #F1F5F9;
      --muted-foreground: #64748B;

      --accent: #E2E8F0;
      --accent-foreground: #0F172A;

      --destructive: #EF4444;
      --destructive-foreground: #ffffff;

      --border: #E2E8F0;
      --input: #E2E8F0;
      --ring: #0F172A;

      --cta: #0369A1;
      --cta-foreground: #ffffff;

      --radius: 0.5rem;

      /* Spacing Tokens */
      --spacing-xs: 0.25rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      --spacing-2xl: 3rem;
      --spacing-3xl: 4rem;

      /* Shadow Tokens */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.15);
      --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --shadow-inner: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);

      --font-sans: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-heading: "Poppins", sans-serif;
    }

    .dark {
      --background: #020617;
      --foreground: #F8FAFC;

      --card: #0F172A;
      --card-foreground: #F8FAFC;

      --popover: #0F172A;
      --popover-foreground: #F8FAFC;

      --primary: #38BDF8;
      /* Lighter blue for dark mode */
      --primary-foreground: #0F172A;

      --secondary: #1E293B;
      --secondary-foreground: #F8FAFC;

      --muted: #1E293B;
      --muted-foreground: #94A3B8;

      --accent: #1E293B;
      --accent-foreground: #F8FAFC;

      --destructive: #7F1D1D;
      --destructive-foreground: #F8FAFC;

      --border: #1E293B;
      --input: #1E293B;
      --ring: #38BDF8;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--background);
      color: var(--foreground);
      scroll-behavior: smooth;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: var(--font-heading);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            card: 'var(--card)',
            'card-foreground': 'var(--card-foreground)',
            popover: 'var(--popover)',
            'popover-foreground': 'var(--popover-foreground)',
            primary: 'var(--primary)',
            'primary-foreground': 'var(--primary-foreground)',
            secondary: 'var(--secondary)',
            'secondary-foreground': 'var(--secondary-foreground)',
            muted: 'var(--muted)',
            'muted-foreground': 'var(--muted-foreground)',
            accent: 'var(--accent)',
            'accent-foreground': 'var(--accent-foreground)',
            destructive: 'var(--destructive)',
            'destructive-foreground': 'var(--destructive-foreground)',
            border: 'var(--border)',
            input: 'var(--input)',
            ring: 'var(--ring)',
          },
          fontFamily: {
            sans: ['Open Sans', 'sans-serif'],
            heading: ['Poppins', 'sans-serif'],
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          },
          boxShadow: {
            sm: 'var(--shadow-sm)',
            md: 'var(--shadow-md)',
            lg: 'var(--shadow-lg)',
            xl: 'var(--shadow-xl)',
            '2xl': 'var(--shadow-2xl)',
            inner: 'var(--shadow-inner)',
          },
          animation: {
            shine: "shine 3s linear infinite",
          },
          keyframes: {
            shine: {
              "0%": { "background-position": "0% 50%" },
              "50%": { "background-position": "100% 50%" },
              "100%": { "background-position": "0% 50%" },
            },
          },
        }
      }
    }
  </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.4",
    "react/": "https://esm.sh/react@19.2.4/",
    "react-dom": "https://esm.sh/react-dom@19.2.4",
    "react-dom/": "https://esm.sh/react-dom@19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@11.11.10?deps=react@19.2.4,react-dom@19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@0.454.0?deps=react@19.2.4",
    "@radix-ui/react-slot": "https://esm.sh/@radix-ui/react-slot@1.1.0?deps=react@19.2.4",
    "@radix-ui/react-icons": "https://esm.sh/@radix-ui/react-icons@1.3.0?deps=react@19.2.4",
    "@radix-ui/react-navigation-menu": "https://esm.sh/@radix-ui/react-navigation-menu@1.2.0?deps=react@19.2.4,react-dom@19.2.4",
    "class-variance-authority": "https://esm.sh/class-variance-authority@0.7.0"
  }
}
</script>
</head>

<body class="bg-background text-foreground overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
</body>

</html>
